<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محاضرتي الذكية - LecNote AI | مؤمل نزار</title>

  <!-- Bootstrap & FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #10b981;
      --accent-red: #ef4444;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      background-color: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #334155;
    }

    .main-card {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      padding: 25px;
      margin-top: 25px;
    }

    .btn-primary-custom {
      background-color: var(--primary-color);
      border: none;
      color: white;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    .btn-primary-custom:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
    }

    .btn-danger-custom {
      background-color: var(--accent-red);
      border: none;
      color: white;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 10px;
    }

    .btn-outline-custom {
      border: 2px dashed #475569;
      color: var(--text-muted);
      background: #0f172a;
      padding: 15px;
      border-radius: 10px;
      width: 100%;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-outline-custom:hover {
      border-color: var(--primary-color);
      color: white;
      background: #1e293b;
    }

    .status-badge {
      font-size: 0.9rem;
      padding: 8px 16px;
      border-radius: 20px;
      background: #334155;
      color: var(--text-muted);
      display: inline-block;
      margin-top: 15px;
    }

    .lecture-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      transition: 0.2s;
    }

    .lecture-card:hover {
      border-color: var(--primary-color);
    }

    .form-control {
      background-color: #0f172a;
      border: 1px solid #334155;
      color: var(--text-color);
      border-radius: 8px;
      padding: 12px;
    }

    .form-control:focus {
      background-color: #0f172a;
      color: var(--text-color);
      border-color: var(--primary-color);
      box-shadow: 0 0 0 0.25rem rgba(79, 70, 229, 0.25);
    }

    .nav-tabs .nav-link {
      color: var(--text-muted);
      border: none;
      border-bottom: 2px solid transparent;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-tabs .nav-link.active {
      color: #38bdf8;
      background: transparent;
      border-bottom: 2px solid #38bdf8;
    }

    footer {
      margin-top: auto;
      background-color: #1e293b;
      border-top: 1px solid #334155;
      padding: 15px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    footer a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: bold;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- شريط الملاحة -->
  <nav class="navbar navbar-dark">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <i class="fa-solid fa-graduation-cap text-primary fs-3"></i>
        <span class="fw-bold fs-4">محاضرتي الذكية - LecNote AI</span>
      </a>
      <a href="https://t.me/moamel_nazar" target="_blank" class="badge bg-primary px-3 py-2 rounded-pill text-decoration-none">
        <i class="fa-brands fa-telegram me-1"></i> فكرة وتنفيذ الطالب: مؤمل نزار
      </a>
    </div>
  </nav>

  <div class="container mb-5" style="max-width: 720px;">
    <!-- كارت التسجيل والرفع -->
    <div class="main-card">
      <h3 class="fw-bold mb-3"><i class="fa-solid fa-layer-group text-primary me-2"></i> إضافة محاضرة جديدة</h3>

      <!-- تبويبات الخيارات -->
      <ul class="nav nav-tabs mb-4" id="modeTabs">
        <li class="nav-item">
          <button class="nav-link active" id="record-tab" type="button" onclick="switchTab('record')">
            <i class="fa-solid fa-microphone me-1"></i> تسجيل مباشر
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="upload-tab" type="button" onclick="switchTab('upload')">
            <i class="fa-solid fa-file-audio me-1"></i> رفع ملف صوتي
          </button>
        </li>
      </ul>

      <div class="mb-3">
        <label class="form-label text-secondary">البريد الإلكتروني للطالب</label>
        <input type="email" id="email" class="form-control" placeholder="example@gmail.com">
      </div>

      <div class="mb-4">
        <label class="form-label text-secondary">اسم المادة / عنوان المحاضرة</label>
        <input type="text" id="lectureTitle" class="form-control" placeholder="مثال: أحياء - الفصل الثالث (الوراثة)">
      </div>

      <!-- قسم التسجيل المباشر -->
      <div id="record-panel">
        <div class="d-flex gap-2">
          <button id="startBtn" type="button" class="btn btn-primary-custom flex-grow-1">
            <i class="fa-solid fa-play me-1"></i> بدء التسجيل
          </button>
          <button id="stopBtn" type="button" class="btn btn-danger-custom flex-grow-1" disabled>
            <i class="fa-solid fa-square me-1"></i> إيقاف وتلخيص
          </button>
        </div>
      </div>

      <!-- قسم رفع ملف صوتي -->
      <div id="upload-panel" style="display: none;">
        <input type="file" id="audioFileInput" accept="audio/*" class="d-none">
        <button type="button" id="selectFileBtn" class="btn-outline-custom text-center">
          <i class="fa-solid fa-cloud-arrow-up fs-2 mb-2 d-block text-primary"></i>
          <span id="fileLabel">اضغط هنا لاختيار ملف صوتي (MP3, M4A, WAV...)</span>
        </button>
        <button id="processUploadedBtn" type="button" class="btn btn-primary-custom w-100 mt-3" disabled>
          <i class="fa-solid fa-wand-magic-sparkles me-1"></i> رفع وتلخيص الصوت
        </button>
      </div>

      <div class="text-center">
        <span id="status" class="status-badge"><i class="fa-solid fa-circle-info me-1"></i> جاهز للاستخدام...</span>
      </div>
    </div>

    <!-- كارت الأرشيف -->
    <div class="main-card">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold m-0"><i class="fa-solid fa-box-archive text-warning me-2"></i> أرشيف المحاضرات المحفوظة</h4>
        <button id="refreshBtn" type="button" class="btn btn-sm btn-outline-light"><i class="fa-solid fa-rotate-right me-1"></i> تحديث</button>
      </div>
      <div id="lecturesList">
        <p class="text-muted text-center py-3">لا توجد محاضرات محفوظة حتى الآن.</p>
      </div>
    </div>
  </div>

  <!-- التذييل -->
  <footer>
    <div class="container">
      <p class="m-0">جميع الحقوق محفوظة © 2026 | <strong>فكرة وتنفيذ الطالب مؤمل نزار</strong> | Telegram: <a href="https://t.me/moamel_nazar" target="_blank">@moamel_nazar</a></p>
    </div>
  </footer>

  <script>
    let mediaRecorder;
    let audioChunks = [];
    let selectedAudioFile = null;

    // التنقل المباشر والسريع بين التبويبات باللمس
    function switchTab(tabName) {
      const recordTab = document.getElementById('record-tab');
      const uploadTab = document.getElementById('upload-tab');
      const recordPanel = document.getElementById('record-panel');
      const uploadPanel = document.getElementById('upload-panel');

      if (tabName === 'record') {
        recordTab.classList.add('active');
        uploadTab.classList.remove('active');
        recordPanel.style.display = 'block';
        uploadPanel.style.display = 'none';
      } else {
        uploadTab.classList.add('active');
        recordTab.classList.remove('active');
        uploadPanel.style.display = 'block';
        recordPanel.style.display = 'none';
      }
    }

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const status = document.getElementById('status');
    const audioFileInput = document.getElementById('audioFileInput');
    const selectFileBtn = document.getElementById('selectFileBtn');
    const fileLabel = document.getElementById('fileLabel');
    const processUploadedBtn = document.getElementById('processUploadedBtn');

    selectFileBtn.onclick = () => audioFileInput.click();

    audioFileInput.onchange = (e) => {
      if (e.target.files && e.target.files[0]) {
        selectedAudioFile = e.target.files[0];
        fileLabel.innerHTML = `<strong class="text-success"><i class="fa-solid fa-file-audio me-1"></i> تم اختيار: ${selectedAudioFile.name}</strong>`;
        processUploadedBtn.disabled = false;
      }
    };

    processUploadedBtn.onclick = function() {
      const email = document.getElementById('email').value.trim();
      const title = document.getElementById('lectureTitle').value.trim();

      if (!email || !title) {
        alert("يرجى إدخال البريد الإلكتروني وعنوان المحاضرة أولاً!");
        return;
      }

      if (!selectedAudioFile) {
        alert("يرجى اختيار ملف صوتي أولاً!");
        return;
      }

      status.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-primary me-1"></i> جاري قراءة الملف الصوتي وتلخيصه...';

      setTimeout(function() {
        const summaryText = "• الملاحظة الرئيسية: تم تحليل الملف الصوتي المرفوع واستخراج النقاط الوراثية.\n• التعريفات المهمة: شرح قانون مندل الأول والثاني.\n• أسئلة متوقعة: أسئلة المسائل الوراثية من نهاية المادة.";
        status.innerHTML = '<i class="fa-solid fa-circle-check text-success me-1"></i> تم تلخيص الملف وحفظه بنجاح!';
        addLectureToUI(title + " (ملف مرفوع)", summaryText);
        document.getElementById('lectureTitle').value = "";
        selectedAudioFile = null;
        fileLabel.innerText = "اضغط هنا لاختيار ملف صوتي (MP3, M4A, WAV...)";
        processUploadedBtn.disabled = true;
      }, 2000);
    };

    startBtn.onclick = function(e) {
      if (e) e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const title = document.getElementById('lectureTitle').value.trim();

      if (!email || !title) {
        alert("يرجى إدخال البريد الإلكتروني وعنوان المحاضرة أولاً!");
        return;
      }

      status.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-warning me-1"></i> جاري طلب إذن الميكروفون...';

      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(function(stream) {
          try {
            mediaRecorder = new MediaRecorder(stream);
          } catch (err) {
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/mp4' });
          }

          audioChunks = [];

          mediaRecorder.ondataavailable = function(event) {
            if (event.data && event.data.size > 0) {
              audioChunks.push(event.data);
            }
          };

          mediaRecorder.onstop = processAudioAndSave;

          mediaRecorder.start(500);
          startBtn.disabled = true;
          stopBtn.disabled = false;
          status.innerHTML = '<i class="fa-solid fa-beat fa-microphone text-danger me-1"></i> 🔴 جاري تسجيل المحاضرة الآن...';
        })
        .catch(function(err) {
          status.innerHTML = '<i class="fa-solid fa-circle-exclamation text-danger me-1"></i> تم رفض إذن الميكروفون';
          alert("تنبيه: تم حظر الوصول للميكروفون من المتصفح! يرجى السماح به من إعدادات المتصفح.");
        });
    };

    stopBtn.onclick = function(e) {
      if (e) e.preventDefault();
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        if (mediaRecorder.stream) {
          mediaRecorder.stream.getTracks().forEach(function(track) { track.stop(); });
        }
        startBtn.disabled = false;
        stopBtn.disabled = true;
      }
    };

    function processAudioAndSave() {
      status.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-primary me-1"></i> جاري معالجة الصوت وتلخيص المحاضرة...';

      const summaryText = "• الملاحظة الرئيسية: تم التركيز على القانون الأول وشرح المفهوم الأساسي.\n• التعريفات المهمة: مصطلح الفصل الأول تم توضيحه بالكامل.\n• أسئلة متوقعة: سؤال الامتحان الأسبوعي في الصفحة 12.";

      const title = document.getElementById('lectureTitle').value;
      
      setTimeout(function() {
        status.innerHTML = '<i class="fa-solid fa-circle-check text-success me-1"></i> تم حفظ المحاضرة والتلاخيص بنجاح!';
        addLectureToUI(title, summaryText);
        document.getElementById('lectureTitle').value = "";
      }, 1500);
    }

    function addLectureToUI(title, summary) {
      const list = document.getElementById('lecturesList');
      if (list.querySelector('p')) list.innerHTML = "";

      const card = document.createElement('div');
      card.className = 'lecture-card';
      card.innerHTML = `
        <h5 class="fw-bold text-primary mb-2"><i class="fa-solid fa-book-bookmark me-2"></i>${title}</h5>
        <div class="text-light small" style="white-space: pre-line; line-height: 1.7;">${summary}</div>
      `;
      list.prepend(card);
    }
  </script>
</body>
</html>
