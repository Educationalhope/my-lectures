<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محاضرتي الذكية - LecNote AI | مؤمل نزار</title>

  <!-- Bootstrap & FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent-red: #ef4444;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      background-color: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #334155;
    }

    .main-card {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      padding: 25px;
      margin-top: 25px;
    }

    .btn-primary-custom {
      background-color: var(--primary-color);
      border: none;
      color: white;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    .btn-primary-custom:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
    }

    .btn-danger-custom {
      background-color: var(--accent-red);
      border: none;
      color: white;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 10px;
    }

    .btn-outline-custom {
      border: 2px dashed #475569;
      color: var(--text-muted);
      background: #0f172a;
      padding: 15px;
      border-radius: 10px;
      width: 100%;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-outline-custom:hover {
      border-color: var(--primary-color);
      color: white;
      background: #1e293b;
    }

    .status-badge {
      font-size: 0.9rem;
      padding: 10px 18px;
      border-radius: 12px;
      background: #334155;
      color: var(--text-muted);
      display: inline-block;
      margin-top: 15px;
      word-break: break-word;
      max-width: 100%;
      line-height: 1.5;
    }

    .lecture-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      transition: 0.2s;
    }

    .lecture-card:hover {
      border-color: var(--primary-color);
    }

    .form-control {
      background-color: #0f172a;
      border: 1px solid #334155;
      color: var(--text-color);
      border-radius: 8px;
      padding: 12px;
    }

    .form-control:focus {
      background-color: #0f172a;
      color: var(--text-color);
      border-color: var(--primary-color);
      box-shadow: 0 0 0 0.25rem rgba(79, 70, 229, 0.25);
    }

    .nav-tabs .nav-link {
      color: var(--text-muted);
      border: none;
      border-bottom: 2px solid transparent;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-tabs .nav-link.active {
      color: #38bdf8;
      background: transparent;
      border-bottom: 2px solid #38bdf8;
    }

    audio {
      width: 100%;
      height: 38px;
      border-radius: 8px;
      margin-top: 10px;
    }

    footer {
      margin-top: auto;
      background-color: #1e293b;
      border-top: 1px solid #334155;
      padding: 15px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    footer a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: bold;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- شريط الملاحة -->
  <nav class="navbar navbar-dark">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <i class="fa-solid fa-graduation-cap text-primary fs-3"></i>
        <span class="fw-bold fs-4">محاضرتي الذكية - LecNote AI</span>
      </a>
      <a href="https://t.me/moamel_nazar" target="_blank" class="badge bg-primary px-3 py-2 rounded-pill text-decoration-none">
        <i class="fa-brands fa-telegram me-1"></i> فكرة وتنفيذ الطالب: مؤمل نزار
      </a>
    </div>
  </nav>

  <div class="container mb-5" style="max-width: 720px;">
    <!-- كارت التسجيل والرفع -->
    <div class="main-card">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold m-0"><i class="fa-solid fa-layer-group text-primary me-2"></i> إضافة محاضرة جديدة</h3>
        <span class="badge bg-success px-3 py-2"><i class="fa-solid fa-bolt me-1"></i> التلخيص الذكي مفعل تلقائياً</span>
      </div>

      <!-- تبويبات الخيارات -->
      <ul class="nav nav-tabs mb-4" id="modeTabs">
        <li class="nav-item">
          <button class="nav-link active" id="record-tab" type="button" onclick="switchTab('record')">
            <i class="fa-solid fa-microphone me-1"></i> تسجيل مباشر
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="upload-tab" type="button" onclick="switchTab('upload')">
            <i class="fa-solid fa-file-audio me-1"></i> رفع ملف صوتي
          </button>
        </li>
      </ul>

      <div class="mb-3">
        <label class="form-label text-secondary">البريد الإلكتروني للطالب</label>
        <input type="email" id="email" class="form-control" placeholder="example@gmail.com">
      </div>

      <div class="mb-3">
        <label class="form-label text-secondary">اسم المادة / عنوان المحاضرة</label>
        <input type="text" id="lectureTitle" class="form-control" placeholder="مثال: اللغة العربية - قواعد وشعر">
      </div>

      <!-- قسم التسجيل المباشر -->
      <div id="record-panel">
        <div class="d-flex gap-2">
          <button id="startBtn" type="button" class="btn btn-primary-custom flex-grow-1">
            <i class="fa-solid fa-play me-1"></i> بدء التسجيل
          </button>
          <button id="stopBtn" type="button" class="btn btn-danger-custom flex-grow-1" disabled>
            <i class="fa-solid fa-square me-1"></i> إيقاف وتلخيص
          </button>
        </div>
      </div>

      <!-- قسم رفع ملف صوتي -->
      <div id="upload-panel" style="display: none;">
        <input type="file" id="audioFileInput" accept="audio/*" class="d-none">
        <button type="button" id="selectFileBtn" class="btn-outline-custom text-center">
          <i class="fa-solid fa-cloud-arrow-up fs-2 mb-2 d-block text-primary"></i>
          <span id="fileLabel">اضغط هنا لاختيار ملف صوتي (MP3, M4A, WAV...)</span>
        </button>
        <button id="processUploadedBtn" type="button" class="btn btn-primary-custom w-100 mt-3" disabled>
          <i class="fa-solid fa-wand-magic-sparkles me-1"></i> رفع وتلخيص الصوت الشامل
        </button>
      </div>

      <div class="text-center mt-3">
        <span id="status" class="status-badge"><i class="fa-solid fa-circle-check text-success me-1"></i> الذكاء الاصطناعي مجهز ومستعد للتلخيص المباشر...</span>
      </div>
    </div>

    <!-- كارت الأرشيف مع شريط البحث -->
    <div class="main-card">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold m-0"><i class="fa-solid fa-box-archive text-warning me-2"></i> أرشيف المحاضرات المحفوظة</h4>
        <button id="refreshBtn" type="button" class="btn btn-sm btn-outline-light"><i class="fa-solid fa-rotate-right me-1"></i> تحديث</button>
      </div>

      <div class="mb-3">
        <input type="text" id="searchInput" onkeyup="filterLectures()" class="form-control" placeholder="🔍 بحث عن محاضرة أو مادة محفوظة...">
      </div>

      <div id="lecturesList">
        <p class="text-muted text-center py-3">لا توجد محاضرات محفوظة حتى الآن.</p>
      </div>
    </div>
  </div>

  <!-- التذييل -->
  <footer>
    <div class="container">
      <p class="m-0">جميع الحقوق محفوظة © 2026 | <strong>فكرة وتنفيذ الطالب مؤمل نزار</strong> | Telegram: <a href="https://t.me/moamel_nazar" target="_blank">@moamel_nazar</a></p>
    </div>
  </footer>

  <script>
    // رابط سيرفرك المباشر في Cloudflare
    const PROXY_SERVER_URL = "https://fancy-dream-56cf.mmoml6638.workers.dev";

    let mediaRecorder;
    let audioChunks = [];
    let selectedAudioFile = null;
    let recordingStartTime = 0;
    let recorderMimeType = "audio/webm";

    window.switchTab = function(tabName) {
      const recordTab = document.getElementById('record-tab');
      const uploadTab = document.getElementById('upload-tab');
      const recordPanel = document.getElementById('record-panel');
      const uploadPanel = document.getElementById('upload-panel');

      if (tabName === 'record') {
        recordTab.classList.add('active');
        uploadTab.classList.remove('active');
        recordPanel.style.display = 'block';
        uploadPanel.style.display = 'none';
      } else {
        uploadTab.classList.add('active');
        recordTab.classList.remove('active');
        uploadPanel.style.display = 'block';
        recordPanel.style.display = 'none';
      }
    };

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const status = document.getElementById('status');
    const audioFileInput = document.getElementById('audioFileInput');
    const selectFileBtn = document.getElementById('selectFileBtn');
    const fileLabel = document.getElementById('fileLabel');
    const processUploadedBtn = document.getElementById('processUploadedBtn');

    selectFileBtn.onclick = () => audioFileInput.click();

    audioFileInput.onchange = (e) => {
      if (e.target.files && e.target.files[0]) {
        selectedAudioFile = e.target.files[0];
        fileLabel.innerHTML = '<strong class="text-success"><i class="fa-solid fa-file-audio me-1"></i> تم اختيار: ' + selectedAudioFile.name + '</strong>';
        processUploadedBtn.disabled = false;
      }
    };

    processUploadedBtn.onclick = async function() {
      const email = document.getElementById('email').value.trim();
      const title = document.getElementById('lectureTitle').value.trim();

      if (!email || !title) {
        alert("يرجى إدخال البريد الإلكتروني وعنوان المحاضرة أولاً!");
        return;
      }

      if (!selectedAudioFile) {
        alert("يرجى اختيار ملف صوتي أولاً!");
        return;
      }

      const audioUrl = URL.createObjectURL(selectedAudioFile);

      status.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-primary me-1"></i> جاري استماع وتلخيص كافة التفاصيل بالذكاء الاصطناعي...';
      try {
        const summaryText = await summarizeAudioWithGemini(selectedAudioFile, title);
        status.innerHTML = '<i class="fa-solid fa-circle-check text-success me-1"></i> تم تحليل وتلخيص الصوت الفعلي كاملاً!';
        addLectureToUI(title + " (ملف مرفوع)", summaryText, audioUrl);
      } catch (err) {
        status.innerHTML = '<i class="fa-solid fa-circle-exclamation text-danger me-1"></i> ' + err.message;
        alert("تنبيه: " + err.message);
        return;
      }

      document.getElementById('lectureTitle').value = "";
      selectedAudioFile = null;
      fileLabel.innerText = "اضغط هنا لاختيار ملف صوتي (MP3, M4A, WAV...)";
      processUploadedBtn.disabled = true;
    };

    startBtn.onclick = function(e) {
      if (e) e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const title = document.getElementById('lectureTitle').value.trim();

      if (!email || !title) {
        alert("يرجى إدخال البريد الإلكتروني وعنوان المحاضرة أولاً!");
        return;
      }

      status.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-warning me-1"></i> جاري طلب إذن الميكروفون...';

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        status.innerHTML = '<i class="fa-solid fa-circle-exclamation text-danger me-1"></i> المتصفح لا يدعم الميكروفون';
        alert("المتصفح الحالي لا يدعم تسجيل الصوت بشكل مباشر.");
        return;
      }

      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(function(stream) {
          audioChunks = [];
          
          if (MediaRecorder.isTypeSupported('audio/webm')) {
            recorderMimeType = 'audio/webm';
          } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
            recorderMimeType = 'audio/mp4';
          } else {
            recorderMimeType = '';
          }

          try {
            mediaRecorder = recorderMimeType ? new MediaRecorder(stream, { mimeType: recorderMimeType }) : new MediaRecorder(stream);
          } catch (err) {
            mediaRecorder = new MediaRecorder(stream);
          }

          recordingStartTime = Date.now();

          mediaRecorder.ondataavailable = function(event) {
            if (event.data && event.data.size > 0) {
              audioChunks.push(event.data);
            }
          };

          mediaRecorder.onstop = processAudioAndSave;

          mediaRecorder.start(500);
          startBtn.disabled = true;
          stopBtn.disabled = false;
          status.innerHTML = '<i class="fa-solid fa-beat fa-microphone text-danger me-1"></i> 🔴 جاري تسجيل المحاضرة الآن...';
        })
        .catch(function(err) {
          status.innerHTML = '<i class="fa-solid fa-circle-exclamation text-danger me-1"></i> تم رفض إذن الميكروفون';
          alert("تنبيه: تم حظر الوصول للميكروفون من المتصفح!");
        });
    };

    stopBtn.onclick = function(e) {
      if (e) e.preventDefault();
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        if (mediaRecorder.stream) {
          mediaRecorder.stream.getTracks().forEach(function(track) { track.stop(); });
        }
        startBtn.disabled = false;
        stopBtn.disabled = true;
      }
    };

    async function processAudioAndSave() {
      const duration = (Date.now() - recordingStartTime) / 1000;

      if (duration < 3 || audioChunks.length === 0) {
        status.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-warning me-1"></i> التسجيل قصير جداً أو فارغ';
        alert("التسجيل قصير جداً أو لم يحتوي على صوت!");
        return;
      }

      status.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-primary me-1"></i> جاري استماع وتلخيص الصوت بكامل تفاصيله...';

      const finalType = mediaRecorder.mimeType || recorderMimeType || 'audio/webm';
      const audioBlob = new Blob(audioChunks, { type: finalType });
      const audioUrl = URL.createObjectURL(audioBlob);
      const title = document.getElementById('lectureTitle').value;

      try {
        const summaryText = await summarizeAudioWithGemini(audioBlob, title);
        status.innerHTML = '<i class="fa-solid fa-circle-check text-success me-1"></i> تم تحليل وتلخيص كافة نقاط التسجيل بنجاح!';
        addLectureToUI(title, summaryText, audioUrl);
      } catch (err) {
        status.innerHTML = '<i class="fa-solid fa-circle-exclamation text-danger me-1"></i> ' + err.message;
        alert("تنبيه: " + err.message);
      }

      document.getElementById('lectureTitle').value = "";
    }

    async function summarizeAudioWithGemini(fileOrBlob, title) {
      const reader = new FileReader();
      const base64Promise = new Promise((resolve, reject) => {
        reader.onloadend = () => {
          if (reader.result) {
            resolve(reader.result.split(',')[1]);
          } else {
            reject(new Error("تعذر قراءة بيانات الملف الصوتي"));
          }
        };
        reader.onerror = reject;
        reader.readAsDataURL(fileOrBlob);
      });

      const base64Data = await base64Promise;
      let mimeType = fileOrBlob.type || 'audio/webm';
      if (mimeType.includes(';')) mimeType = mimeType.split(';')[0];

      const promptText = `أنت أستاذ ومساعد دراسي ذكي ومحترف. استمع بعناية فائقة للملف الصوتي المرفق لمادة [${title}]، وقم بتقديم تلخيص شامل وكامل يدون كل التفاصيل والنقاط المهمة التي ذكرها المحاضر في التسجيل باللغة العربية:

1. 📌 **المحاور والنقاط الرئيسية:** (استخرج كل موضوع أو فكرة تم شرحها بالترتيب).
2. 📝 **التعاريف، المفاهيم والقوانين:** (اذكر كل تعريـف أو قانون أو قاعدة تم توضيحها بالكامل).
3. ❓ **الأسئلة والتمارين المتوقعة:** (استخرج جميع الأسئلة أو المسائل التي ركز عليها الأستاذ أثناء المقطع).
4. 💡 **ملاحظات وتنبهيات مهمة:** (أي ملاحظة قالها المحاضر بخصوص الامتحان أو الواجبات).

يرجى عدم اختصار الشرح بشكل مخل، واستخراج كافة التفاصيل الصوتية بدقة لخدمة الطالب.`;

      const res = await fetch(PROXY_SERVER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          prompt: promptText,
          mimeType: mimeType,
          audioBase64: base64Data
        })
      });

      if (!res.ok) {
        let errText = await res.text();
        try {
          const errObj = JSON.parse(errText);
          errText = errObj.error?.message || errObj.message || errText;
        } catch(e) {}
        throw new Error(errText || ("خطأ استجابة من الخادم: " + res.status));
      }

      const json = await res.json();

      if (json.error) {
        throw new Error(json.error.message || JSON.stringify(json.error));
      }

      if (json.candidates && json.candidates[0] && json.candidates[0].content && json.candidates[0].content.parts) {
        return json.candidates[0].content.parts[0].text;
      }

      if (json.message) {
        throw new Error("سيرفر Cloudflare يحتاج ضغط زر Deploy الأزرق: " + json.message);
      }

      throw new Error("لم يتم استلام نص التلخيص بشكل صحيح من الذكاء الاصطناعي.");
    }

    window.addLectureToUI = function(title, summary, audioSrc) {
      const list = document.getElementById('lecturesList');
      if (list.querySelector('p')) list.innerHTML = "";

      const cardId = 'card-' + Date.now();
      const card = document.createElement('div');
      card.className = 'lecture-card';
      card.id = cardId;

      const audioHTML = audioSrc ? `<audio controls src="${audioSrc}" class="mt-2"></audio>` : '';

      card.innerHTML = `
        <div class="d-flex justify-content-between align-items-start mb-2">
          <h5 class="fw-bold text-primary m-0 lecture-title-text"><i class="fa-solid fa-book-bookmark me-2"></i>${title}</h5>
          <div class="d-flex gap-1">
            <button class="btn btn-sm btn-outline-info" onclick="copyLecture('${cardId}')" title="نسخ"><i class="fa-solid fa-copy"></i></button>
            <button class="btn btn-sm btn-outline-success" onclick="downloadTXT('${cardId}')" title="تنزيل TXT"><i class="fa-solid fa-download"></i></button>
            <button class="btn btn-sm btn-outline-warning" onclick="editLecture('${cardId}')" title="تعديل"><i class="fa-solid fa-pen"></i></button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteLecture('${cardId}')" title="حذف"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
        <div class="text-light small lecture-summary-text" style="white-space: pre-line; line-height: 1.7;">${summary}</div>
        ${audioHTML}
      `;
      list.prepend(card);
    };

    window.deleteLecture = function(cardId) {
      if (confirm("هل أنت متأكد من إزالة هذه المحاضرة من الأرشيف؟")) {
        const card = document.getElementById(cardId);
        if (card) card.remove();
        
        const list = document.getElementById('lecturesList');
        if (list.children.length === 0) {
          list.innerHTML = '<p class="text-muted text-center py-3">لا توجد محاضرات محفوظة حتى الآن.</p>';
        }
      }
    };

    window.editLecture = function(cardId) {
      const card = document.getElementById(cardId);
      const titleElem = card.querySelector('.lecture-title-text');
      const summaryElem = card.querySelector('.lecture-summary-text');

      const currentTitle = titleElem.innerText.replace(/^.*?  /, '');
      const currentSummary = summaryElem.innerText;

      const newTitle = prompt("تعديل عنوان المحاضرة:", currentTitle);
      if (newTitle === null) return;

      const newSummary = prompt("تعديل ملخص المحاضرة:", currentSummary);
      if (newSummary === null) return;

      titleElem.innerHTML = '<i class="fa-solid fa-book-bookmark me-2"></i>' + newTitle;
      summaryElem.innerText = newSummary;
    };

    window.copyLecture = function(cardId) {
      const card = document.getElementById(cardId);
      const title = card.querySelector('.lecture-title-text').innerText;
      const summary = card.querySelector('.lecture-summary-text').innerText;

      const fullText = title + "\n\n" + summary + "\n\nتم التلخيص بواسطة: LecNote AI - مؤمل نزار";
      navigator.clipboard.writeText(fullText).then(() => {
        alert("تم نسخ التلخيص بنجاح إلى الحافظة!");
      });
    };

    window.downloadTXT = function(cardId) {
      const card = document.getElementById(cardId);
      const title = card.querySelector('.lecture-title-text').innerText;
      const summary = card.querySelector('.lecture-summary-text').innerText;

      const content = title + "\n" + "=".repeat(30) + "\n\n" + summary + "\n\n" + "=".repeat(30) + "\nفكرة وتنفيذ الطالب: مؤمل نزار | Telegram: @moamel_nazar";
      
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = title.replace(/[^\w\s-]/gi, '') + '_ملخص.txt';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
      }, 0);
    };

    window.filterLectures = function() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.getElementsByClassName('lecture-card');

      for (let i = 0; i < cards.length; i++) {
        const text = cards[i].innerText.toLowerCase();
        cards[i].style.display = text.includes(input) ? 'block' : 'none';
      }
    };
  </script>
</body>
</html>
