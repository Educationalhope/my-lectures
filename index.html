<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>محاضرتي الذكية - تفصيل شامل | مؤمل نزار</title>

  <!-- Bootstrap & FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent-red: #ef4444;
      --accent-green: #10b981;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      background-color: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #334155;
    }

    .main-card {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      padding: 25px;
      margin-top: 25px;
    }

    .btn-primary-custom {
      background-color: var(--primary-color);
      border: none;
      color: white;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    .btn-primary-custom:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
    }

    .btn-danger-custom {
      background-color: var(--accent-red);
      border: none;
      color: white;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 10px;
    }

    .btn-outline-custom {
      border: 2px dashed #475569;
      color: var(--text-muted);
      background: #0f172a;
      padding: 15px;
      border-radius: 10px;
      width: 100%;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-outline-custom:hover {
      border-color: var(--primary-color);
      color: white;
      background: #1e293b;
    }

    .status-badge {
      font-size: 0.9rem;
      padding: 8px 16px;
      border-radius: 20px;
      background: #334155;
      color: var(--text-muted);
      display: inline-block;
      margin-top: 15px;
    }

    .lecture-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      transition: 0.2s;
    }

    /* تنسيق الخانات الجديدة للتلخيص المفصل */
    .summary-box {
      background-color: #1e293b;
      border-right: 4px solid transparent;
      transition: 0.3s;
    }
    .summary-box:hover {
      background-color: #334155;
      transform: translateY(-2px);
    }
    .box-info { border-right-color: #0dcaf0; }
    .box-warning { border-right-color: #ffc107; }
    .box-danger { border-right-color: #ef4444; }
    .box-success { border-right-color: #10b981; }

    .form-control, .form-select {
      background-color: #0f172a;
      border: 1px solid #334155;
      color: var(--text-color);
      border-radius: 8px;
      padding: 12px;
    }

    .form-control:focus, .form-select:focus {
      background-color: #0f172a;
      color: var(--text-color);
      border-color: var(--primary-color);
      box-shadow: 0 0 0 0.25rem rgba(79, 70, 229, 0.25);
    }

    .nav-tabs .nav-link {
      color: var(--text-muted);
      border: none;
      border-bottom: 2px solid transparent;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-tabs .nav-link.active {
      color: #38bdf8;
      background: transparent;
      border-bottom: 2px solid #38bdf8;
    }
    
    .folder-tab {
      cursor: pointer;
      padding: 8px 15px;
      border-radius: 20px;
      background-color: #1e293b;
      border: 1px solid #334155;
      color: var(--text-muted);
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    
    .folder-tab:hover {
      background-color: #334155;
      color: white;
    }
    
    .folder-tab.active {
      background-color: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }
    
    .folder-tab.add-new {
      border: 1px dashed #10b981;
      color: #10b981;
      background: transparent;
    }
    
    .folder-tab.add-new:hover {
      background: rgba(16, 185, 129, 0.1);
    }

    audio {
      width: 100%;
      height: 38px;
      border-radius: 8px;
      margin-top: 10px;
    }

    footer {
      margin-top: auto;
      background-color: #1e293b;
      border-top: 1px solid #334155;
      padding: 15px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- شريط الملاحة -->
  <nav class="navbar navbar-dark">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <i class="fa-solid fa-graduation-cap text-primary fs-3"></i>
        <span class="fw-bold fs-4">محاضرتي الذكية <span class="badge bg-success fs-6">V7 (التفصيل الذكي)</span></span>
      </a>
      <a href="https://t.me/moamel_nazar" target="_blank" class="badge bg-primary px-3 py-2 rounded-pill text-decoration-none">
        <i class="fa-brands fa-telegram me-1"></i> فكرة وتنفيذ الطالب: مؤمل نزار
      </a>
    </div>
  </nav>

  <div class="container mb-5" style="max-width: 850px;">
    <!-- كارت التسجيل والرفع -->
    <div class="main-card">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold m-0"><i class="fa-solid fa-layer-group text-primary me-2"></i> إضافة محاضرة جديدة</h3>
      </div>

      <ul class="nav nav-tabs mb-4" id="modeTabs">
        <li class="nav-item">
          <button class="nav-link active" id="record-tab" type="button" onclick="switchTab('record')">
            <i class="fa-solid fa-microphone me-1"></i> تسجيل مباشر
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="upload-tab" type="button" onclick="switchTab('upload')">
            <i class="fa-solid fa-file-audio me-1"></i> رفع ملف صوتي
          </button>
        </li>
      </ul>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label text-secondary"><i class="fa-solid fa-folder-open me-1"></i> اختر المادة (المجلد)</label>
          <div class="d-flex gap-2">
            <select id="subjectSelect" class="form-select text-light">
            </select>
            <button type="button" class="btn btn-success" onclick="addNewSubject()" title="إنشاء مجلد مادة جديد">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label text-secondary"><i class="fa-solid fa-pen me-1"></i> عنوان المحاضرة</label>
          <input type="text" id="lectureTitle" class="form-control" placeholder="مثال: المحاضرة الأولى">
        </div>
      </div>

      <div id="record-panel">
        <div class="d-flex gap-2">
          <button id="startBtn" type="button" class="btn btn-primary-custom flex-grow-1">
            <i class="fa-solid fa-play me-1"></i> بدء التسجيل
          </button>
          <button id="stopBtn" type="button" class="btn btn-danger-custom flex-grow-1" disabled>
            <i class="fa-solid fa-square me-1"></i> إيقاف وتلخيص شامل
          </button>
        </div>
      </div>

      <div id="upload-panel" style="display: none;">
        <input type="file" id="audioFileInput" accept="audio/*" class="d-none">
        <button type="button" id="selectFileBtn" class="btn-outline-custom text-center">
          <i class="fa-solid fa-cloud-arrow-up fs-2 mb-2 d-block text-primary"></i>
          <span id="fileLabel">اضغط هنا لاختيار ملف صوتي (MP3, M4A, WAV...)</span>
        </button>
        <button id="processUploadedBtn" type="button" class="btn btn-primary-custom w-100 mt-3" disabled>
          <i class="fa-solid fa-wand-magic-sparkles me-1"></i> رفع واستخراج تفاصيل المحاضرة
        </button>
      </div>

      <div class="text-center">
        <span id="status" class="status-badge"><i class="fa-solid fa-circle-check text-success me-1"></i> النظام جاهز لتحليل المحاضرة وتفصيلها...</span>
      </div>
    </div>

    <!-- كارت الأرشيف -->
    <div class="main-card">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold m-0"><i class="fa-solid fa-box-archive text-warning me-2"></i> أرشيف المحاضرات المحفوظة</h4>
        <span class="badge bg-success">يتم الحفظ في جهازك تلقائياً</span>
      </div>

      <div class="mb-3">
        <h6 class="text-secondary small mb-2">مجلدات المواد (اضغط للتصفية):</h6>
        <div id="subjectFilters" class="d-flex flex-wrap gap-2">
        </div>
      </div>

      <div class="mb-3 mt-3">
        <input type="text" id="searchInput" onkeyup="filterLecturesSearch()" class="form-control" placeholder="🔍 بحث عن محاضرة (بالمحاور، الأسئلة، أو العنوان)...">
      </div>

      <div id="lecturesList">
      </div>
    </div>
  </div>

  <footer>
    <div class="container">
      <p class="m-0">جميع الحقوق محفوظة © 2026 | <strong>فكرة وتنفيذ الطالب مؤمل نزار</strong></p>
    </div>
  </footer>

  <script>
    function getEmbeddedKey() {
      const _k1 = "AQ.Ab8RN6Jj8JxU";
      const _k2 = "vwS2bnCTVgs1e7W";
      const _k3 = "pmfwCCCOlzU5Nqob92lNxEQ";
      return _k1 + _k2 + _k3;
    }

    let lecturesData = JSON.parse(localStorage.getItem('lecnote_lectures_data')) || [];
    let subjectsList = JSON.parse(localStorage.getItem('lecnote_subjects_data')) || ['عامة']; 
    let sessionAudio = {}; 
    let currentActiveSubject = 'all';

    [...new Set(lecturesData.map(l => l.subject))].forEach(s => {
      if(!subjectsList.includes(s) && s.trim() !== '') {
        subjectsList.push(s);
      }
    });
    localStorage.setItem('lecnote_subjects_data', JSON.stringify(subjectsList));

    window.onload = function() {
      updateSubjectSelect();
      renderSubjects();
      renderLectures('all');
    };

    function addNewSubject() {
      const newSub = prompt("أدخل اسم المادة (المجلد) الجديد:\nمثال: التشريح، برمجة، شبكات...");
      if (newSub && newSub.trim() !== '') {
        const cleanName = newSub.trim();
        if (!subjectsList.includes(cleanName)) {
          subjectsList.push(cleanName);
          localStorage.setItem('lecnote_subjects_data', JSON.stringify(subjectsList));
          updateSubjectSelect();
          renderSubjects();
          document.getElementById('subjectSelect').value = cleanName;
        } else {
          alert("هذه المادة موجودة مسبقاً!");
          document.getElementById('subjectSelect').value = cleanName;
        }
      }
    }

    function updateSubjectSelect() {
      const select = document.getElementById('subjectSelect');
      select.innerHTML = '';
      subjectsList.forEach(sub => {
        select.innerHTML += `<option value="${sub}">${sub}</option>`;
      });
    }

    function renderSubjects() {
      const filtersDiv = document.getElementById('subjectFilters');
      let html = `<div class="folder-tab ${currentActiveSubject === 'all' ? 'active' : ''}" onclick="renderLectures('all')">
                    <i class="fa-solid fa-border-all"></i> الكل
                  </div>`;
      
      subjectsList.forEach(sub => {
        html += `<div class="folder-tab ${currentActiveSubject === sub ? 'active' : ''}" onclick="renderLectures('${sub}')">
                    <i class="fa-solid fa-folder"></i> ${sub}
                 </div>`;
      });

      html += `<div class="folder-tab add-new" onclick="addNewSubject()" title="إنشاء مجلد جديد">
                  <i class="fa-solid fa-plus"></i> إضافة مجلد
               </div>`;

      filtersDiv.innerHTML = html;
    }

    function getSummaryTextFormat(summary) {
      if (typeof summary === 'string') return summary;
      
      let text = "";
      if (summary.topics && summary.topics.length > 0) {
        text += "📌 المحاور الرئيسية:\n" + summary.topics.map(t=>"- "+t).join("\n") + "\n\n";
      }
      if (summary.concepts && summary.concepts.length > 0) {
        text += "🧠 المفاهيم والقوانين:\n" + summary.concepts.map(t=>"- "+t).join("\n") + "\n\n";
      }
      if (summary.questions && summary.questions.length > 0) {
        text += "❓ الأسئلة المتوقعة:\n" + summary.questions.map(t=>"- "+t).join("\n") + "\n\n";
      }
      if (summary.notes && summary.notes.length > 0) {
        text += "💡 ملاحظات هامة:\n" + summary.notes.map(t=>"- "+t).join("\n") + "\n\n";
      }
      return text;
    }

    function renderLectures(subjectFilter) {
      currentActiveSubject = subjectFilter;
      renderSubjects(); 

      const list = document.getElementById('lecturesList');
      list.innerHTML = "";
      
      const filtered = subjectFilter === 'all' 
        ? lecturesData 
        : lecturesData.filter(l => l.subject === subjectFilter);

      if (filtered.length === 0) {
        list.innerHTML = '<p class="text-muted text-center py-4"><i class="fa-solid fa-folder-open fs-1 mb-3 text-secondary d-block"></i>المجلد فارغ. ابدأ بتسجيل أو رفع محاضرة لإضافتها هنا.</p>';
        return;
      }

      filtered.sort((a,b) => b.timestamp - a.timestamp).forEach(lec => {
        const card = document.createElement('div');
        card.className = 'lecture-card search-target';
        card.id = lec.id;
        
        let audioHTML = sessionAudio[lec.id] 
          ? `<audio controls src="${sessionAudio[lec.id]}" class="mt-3 w-100"></audio>` 
          : `<p class="text-secondary small mt-3 m-0"><i class="fa-solid fa-info-circle me-1"></i> (الصوت متاح أثناء التسجيل فقط لتوفير المساحة، التفاصيل محفوظة للأبد)</p>`;

        // Render Summary Blocks or old string
        let summaryHTML = '';
        if (typeof lec.summary === 'string') {
          // القديم
          summaryHTML = `<div class="text-light small mt-3" style="white-space: pre-line; line-height: 1.7;">${lec.summary}</div>`;
        } else {
          // الجديد: الخانات المنفصلة
          const s = lec.summary;
          
          const topicsList = (s.topics||[]).map(x=>`<li class="mb-1">${x}</li>`).join('');
          const conceptsList = (s.concepts||[]).map(x=>`<li class="mb-1">${x}</li>`).join('');
          const questionsList = (s.questions||[]).map(x=>`<li class="mb-1">${x}</li>`).join('');
          const notesList = (s.notes||[]).map(x=>`<li class="mb-1">${x}</li>`).join('');

          summaryHTML = `
            <div class="row g-3 mt-2">
              <div class="col-md-6">
                <div class="p-3 rounded h-100 summary-box box-info">
                  <h6 class="text-info mb-3 fw-bold border-bottom border-secondary pb-2"><i class="fa-solid fa-list-check me-2"></i>المحاور الرئيسية</h6>
                  <ul class="small mb-0 text-light ps-3" style="line-height: 1.6;">${topicsList || '<li>لا يوجد</li>'}</ul>
                </div>
              </div>
              <div class="col-md-6">
                <div class="p-3 rounded h-100 summary-box box-warning">
                  <h6 class="text-warning mb-3 fw-bold border-bottom border-secondary pb-2"><i class="fa-solid fa-brain me-2"></i>المفاهيم والقوانين</h6>
                  <ul class="small mb-0 text-light ps-3" style="line-height: 1.6;">${conceptsList || '<li>لا يوجد</li>'}</ul>
                </div>
              </div>
              <div class="col-md-6">
                <div class="p-3 rounded h-100 summary-box box-danger">
                  <h6 class="text-danger mb-3 fw-bold border-bottom border-secondary pb-2"><i class="fa-solid fa-circle-question me-2"></i>الأسئلة المتوقعة (مهم)</h6>
                  <ul class="small mb-0 text-light ps-3" style="line-height: 1.6;">${questionsList || '<li>لا يوجد</li>'}</ul>
                </div>
              </div>
              <div class="col-md-6">
                <div class="p-3 rounded h-100 summary-box box-success">
                  <h6 class="text-success mb-3 fw-bold border-bottom border-secondary pb-2"><i class="fa-solid fa-lightbulb me-2"></i>ملاحظات هامة للتركيز</h6>
                  <ul class="small mb-0 text-light ps-3" style="line-height: 1.6;">${notesList || '<li>لا يوجد</li>'}</ul>
                </div>
              </div>
            </div>
          `;
        }

        // Search text helper (hidden text to make searching work perfectly)
        const searchHiddenText = typeof lec.summary === 'string' ? lec.summary : JSON.stringify(lec.summary);

        card.innerHTML = `
          <div class="d-flex justify-content-between align-items-start mb-2">
            <div>
              <span class="badge bg-primary mb-2"><i class="fa-solid fa-folder me-1"></i>${lec.subject}</span>
              <h5 class="fw-bold text-light m-0 lecture-title-text">${lec.title}</h5>
            </div>
            <div class="d-flex gap-1">
              <button class="btn btn-sm btn-outline-info" onclick="copyLecture('${lec.id}')" title="نسخ التفاصيل"><i class="fa-solid fa-copy"></i></button>
              <button class="btn btn-sm btn-outline-success" onclick="downloadTXT('${lec.id}')" title="تنزيل كملف نصي"><i class="fa-solid fa-download"></i></button>
              <button class="btn btn-sm btn-outline-danger" onclick="deleteLecture('${lec.id}')" title="حذف المحاضرة"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
          ${summaryHTML}
          ${audioHTML}
          <div class="d-none search-data">${searchHiddenText}</div>
        `;
        list.appendChild(card);
      });
    }

    function deleteLecture(id) {
      if (confirm("هل أنت متأكد من حذف هذه المحاضرة بشكل نهائي؟")) {
        lecturesData = lecturesData.filter(l => l.id !== id);
        localStorage.setItem('lecnote_lectures_data', JSON.stringify(lecturesData));
        delete sessionAudio[id];
        renderLectures(currentActiveSubject);
      }
    }

    function copyLecture(id) {
      const lec = lecturesData.find(l => l.id === id);
      const textToCopy = getSummaryTextFormat(lec.summary);
      const fullText = `المادة: ${lec.subject}\nالمحاضرة: ${lec.title}\n\n${textToCopy}\n\nتم التحليل والتفصيل بواسطة: LecNote AI`;
      
      navigator.clipboard.writeText(fullText).then(() => {
        alert("تم نسخ التفاصيل بنجاح!");
      }).catch(err => {
        const textArea = document.createElement("textarea");
        textArea.value = fullText;
        document.body.appendChild(textArea);
        textArea.select();
        try { document.execCommand('copy'); alert("تم نسخ التفاصيل بنجاح!"); } catch (err) {}
        document.body.removeChild(textArea);
      });
    }

    function downloadTXT(id) {
      const lec = lecturesData.find(l => l.id === id);
      const textToCopy = getSummaryTextFormat(lec.summary);
      const content = `المادة: ${lec.subject}\nالمحاضرة: ${lec.title}\n` + "=".repeat(30) + `\n\n${textToCopy}\n\n` + "=".repeat(30) + `\nفكرة وتنفيذ الطالب: مؤمل نزار`;
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = lec.subject + '_' + lec.title + '.txt';
      a.click();
    }

    function filterLecturesSearch() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.getElementsByClassName('search-target');
      for (let i = 0; i < cards.length; i++) {
        const text = cards[i].innerText.toLowerCase();
        cards[i].style.display = text.includes(input) ? 'block' : 'none';
      }
    }

    let mediaRecorder;
    let audioChunks = [];
    let selectedAudioFile = null;
    let recordingStartTime = 0;

    function switchTab(tabName) {
      const recordTab = document.getElementById('record-tab');
      const uploadTab = document.getElementById('upload-tab');
      const recordPanel = document.getElementById('record-panel');
      const uploadPanel = document.getElementById('upload-panel');

      if (tabName === 'record') {
        recordTab.classList.add('active');
        uploadTab.classList.remove('active');
        recordPanel.style.display = 'block';
        uploadPanel.style.display = 'none';
      } else {
        uploadTab.classList.add('active');
        recordTab.classList.remove('active');
        uploadPanel.style.display = 'block';
        recordPanel.style.display = 'none';
      }
    }

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const status = document.getElementById('status');
    const audioFileInput = document.getElementById('audioFileInput');
    const selectFileBtn = document.getElementById('selectFileBtn');
    const fileLabel = document.getElementById('fileLabel');
    const processUploadedBtn = document.getElementById('processUploadedBtn');

    selectFileBtn.onclick = () => audioFileInput.click();

    audioFileInput.onchange = (e) => {
      if (e.target.files && e.target.files[0]) {
        selectedAudioFile = e.target.files[0];
        fileLabel.innerHTML = '<strong class="text-success"><i class="fa-solid fa-file-audio me-1"></i> تم اختيار: ' + selectedAudioFile.name + '</strong>';
        processUploadedBtn.disabled = false;
      }
    };

    processUploadedBtn.onclick = async function() {
      const subject = document.getElementById('subjectSelect').value;
      const title = document.getElementById('lectureTitle').value.trim();
      const apiKey = getEmbeddedKey();

      if (!subject) { alert("يرجى إنشاء مجلد مادة أولاً!"); return; }
      if (!title) { alert("يرجى إدخال عنوان المحاضرة!"); return; }
      if (!selectedAudioFile) { alert("يرجى اختيار ملف صوتي!"); return; }

      const audioUrl = URL.createObjectURL(selectedAudioFile);

      status.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-primary me-1"></i> جاري التحليل العميق وتفصيل المحاضرة... (قد يستغرق بعض الوقت)';
      try {
        const summaryData = await summarizeAudioWithGeminiJSON(selectedAudioFile, apiKey, subject, title);
        status.innerHTML = '<i class="fa-solid fa-circle-check text-success me-1"></i> تم الاستخراج والتفصيل والحفظ بنجاح!';
        
        const newId = 'card-' + Date.now();
        sessionAudio[newId] = audioUrl;
        lecturesData.push({ id: newId, subject: subject, title: title, summary: summaryData, timestamp: Date.now() });
        localStorage.setItem('lecnote_lectures_data', JSON.stringify(lecturesData));
        
        renderLectures(subject);
      } catch (err) {
        status.innerHTML = '<i class="fa-solid fa-circle-exclamation text-danger me-1"></i> حدث خطأ أثناء التحليل';
        alert("تنبيه: " + err.message);
      }

      document.getElementById('lectureTitle').value = "";
      selectedAudioFile = null;
      fileLabel.innerText = "اضغط هنا لاختيار ملف صوتي";
      processUploadedBtn.disabled = true;
    };

    startBtn.onclick = function(e) {
      if (e) e.preventDefault();
      const subject = document.getElementById('subjectSelect').value;
      const title = document.getElementById('lectureTitle').value.trim();
      
      if (!subject) { alert("يرجى إنشاء مجلد مادة أولاً!"); return; }
      if (!title) { alert("يرجى إدخال عنوان المحاضرة أولاً!"); return; }

      status.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-warning me-1"></i> جاري طلب إذن الميكروفون...';

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert("المتصفح لا يدعم الميكروفون."); return;
      }

      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(function(stream) {
          try { mediaRecorder = new MediaRecorder(stream); } 
          catch (err) { mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/mp4' }); }

          audioChunks = [];
          recordingStartTime = Date.now();
          mediaRecorder.ondataavailable = function(event) { if (event.data && event.data.size > 0) audioChunks.push(event.data); };
          mediaRecorder.onstop = processAudioAndSave;
          mediaRecorder.start(500);
          
          startBtn.disabled = true;
          stopBtn.disabled = false;
          status.innerHTML = '<i class="fa-solid fa-beat fa-microphone text-danger me-1"></i> 🔴 جاري تسجيل المحاضرة... (الوقت مفتوح حسب حجم الملف)';
        })
        .catch(function(err) { alert("تم حظر الميكروفون!"); });
    };

    stopBtn.onclick = function(e) {
      if (e) e.preventDefault();
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        if (mediaRecorder.stream) { mediaRecorder.stream.getTracks().forEach(track => track.stop()); }
        startBtn.disabled = false;
        stopBtn.disabled = true;
      }
    };

    async function processAudioAndSave() {
      const duration = (Date.now() - recordingStartTime) / 1000;
      if (duration < 3 || audioChunks.length === 0) { alert("التسجيل قصير جداً!"); return; }

      status.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-primary me-1"></i> جاري استخراج التفاصيل وتكوين الخانات...';

      const audioBlob = new Blob(audioChunks, { type: 'audio/mp4' });
      const audioUrl = URL.createObjectURL(audioBlob);
      const subject = document.getElementById('subjectSelect').value;
      const title = document.getElementById('lectureTitle').value.trim();
      const apiKey = getEmbeddedKey();

      try {
        const summaryData = await summarizeAudioWithGeminiJSON(audioBlob, apiKey, subject, title);
        status.innerHTML = '<i class="fa-solid fa-circle-check text-success me-1"></i> تم التفصيل والحفظ بنجاح!';
        
        const newId = 'card-' + Date.now();
        sessionAudio[newId] = audioUrl;
        lecturesData.push({ id: newId, subject: subject, title: title, summary: summaryData, timestamp: Date.now() });
        localStorage.setItem('lecnote_lectures_data', JSON.stringify(lecturesData));
        
        renderLectures(subject);
      } catch (err) {
        status.innerHTML = '<i class="fa-solid fa-circle-exclamation text-danger me-1"></i> خطأ في استخراج التفاصيل';
        alert("تنبيه: " + err.message);
      }
      document.getElementById('lectureTitle').value = "";
    }

    async function summarizeAudioWithGeminiJSON(fileOrBlob, apiKey, subject, title) {
      const reader = new FileReader();
      const base64Promise = new Promise((resolve) => {
        reader.onloadend = () => resolve(reader.result.split(',')[1]);
        reader.readAsDataURL(fileOrBlob);
      });

      const base64Data = await base64Promise;
      const mimeType = fileOrBlob.type || 'audio/mp4';

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;

      const promptText = `أنت أستاذ جامعي وخبير في تبسيط المعلومات. قم بتحليل وتلخيص هذه المحاضرة الصوتية (المادة: ${subject}، العنوان: ${title}) بدقة عالية واحترافية.
يجب إرجاع الرد بصيغة JSON صالح (Valid JSON) حصراً، يحتوي على المفاتيح الأربعة التالية فقط بدون أي نصوص أو علامات أخرى:
{
  "topics": ["نقطة 1 تفصيلية هنا", "نقطة 2 هنا"],
  "concepts": ["المفهوم الأول مع تعريفه", "القانون الثاني مع شرحه"],
  "questions": ["س 1: ...؟ ج: ...", "س 2: ...؟ ج: ..."],
  "notes": ["ملاحظة مهمة 1", "ملاحظة مهمة 2 للتركيز عليها"]
}
اكتب باللغة العربية الواضحة، وإذا لم تتوفر معلومات لقسم معين، اترك المصفوفة فارغة []. لا تضف أي نص خارج الـ JSON.`;

      const requestBody = {
        contents: [{
          parts: [
            { text: promptText },
            {
              inline_data: { mime_type: mimeType, data: base64Data }
            }
          ]
        }],
        generationConfig: {
          response_mime_type: "application/json"
        }
      };

      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(requestBody)
      });

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.error ? errorData.error.message : 'فشل الاتصال بالخادم');
      }

      const data = await response.json();
      if (!data.candidates || !data.candidates[0].content) {
        throw new Error('لم يتم التوصل لاستجابة');
      }

      let rawText = data.candidates[0].content.parts[0].text;
      try {
        let cleanJson = rawText.replace(/```json/gi, '').replace(/```/gi, '').trim();
        return JSON.parse(cleanJson);
      } catch (e) {
        return {
          topics: ["(تعذر تقسيم المحاور بشكل آلي)"],
          concepts: [],
          questions: [],
          notes: [rawText]
        };
      }
    }
  </script>
